<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" width="512" height="384" role="img" aria-label="Chaîne Voyage">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#12a6dd"/>
      <stop offset=".45"  stop-color="#5cc8ef"/>
      <stop offset="1"    stop-color="#c9ecfa"/>
    </linearGradient>

    <linearGradient id="globe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f2fcff"/>
      <stop offset=".55" stop-color="#a5dcf2"/>
      <stop offset="1"   stop-color="#5db8dd"/>
    </linearGradient>

    <radialGradient id="gloss" cx="50%" cy="-5%" r="85%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b4a68" flood-opacity=".35"/>
    </filter>

    <clipPath id="globeClip">
      <circle cx="256" cy="356" r="152"/>
    </clipPath>
  </defs>

  <!-- Ciel -->
  <rect width="512" height="384" fill="url(#sky)"/>
  <rect width="512" height="384" fill="url(#gloss)"/>

  <!-- Nuages -->
  <g fill="#ffffff" opacity=".45">
    <ellipse cx="66"  cy="196" rx="54" ry="19"/>
    <ellipse cx="96"  cy="186" rx="34" ry="22"/>
    <ellipse cx="452" cy="128" rx="46" ry="16"/>
    <ellipse cx="428" cy="120" rx="28" ry="18"/>
  </g>

  <!-- Globe posé en bas, coupé par le cadre -->
  <circle cx="256" cy="356" r="152" fill="url(#globe)"/>
  <g clip-path="url(#globeClip)" fill="none" stroke="#6cc4e6" stroke-width="3" opacity=".55">
    <ellipse cx="256" cy="356" rx="152" ry="56"/>
    <ellipse cx="256" cy="356" rx="60"  ry="152"/>
    <ellipse cx="256" cy="356" rx="118" ry="152"/>
  </g>
  <circle cx="256" cy="356" r="152" fill="none" stroke="#ffffff" stroke-width="5" opacity=".9"/>

  <!-- Continents stylisés : formes larges et peu nombreuses, pour
       rester lisibles une fois la bannière réduite à ~250 px. -->
  <g clip-path="url(#globeClip)" fill="#57bf63">
    <path d="M112 250c46-30 108-18 146 8 22 15 46 10 62 24 16 14 6 36-18 42-40 10-92 4-140-10-34-10-64-24-64-40 0-10 6-18 14-24z"/>
    <path d="M316 336c34-12 74 2 80 26 6 22-22 38-56 34-32-4-58-22-54-40 2-10 16-16 30-20z"/>
  </g>

  <!-- Trajectoire pointillée + avion -->
  <path d="M92 248 Q244 96 402 168"
        fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="1 24" opacity=".95" filter="url(#soft)"/>
  <circle cx="92" cy="248" r="11" fill="#ffffff" filter="url(#soft)"/>
  <circle cx="92" cy="248" r="5"  fill="#12a6dd"/>

  <g transform="translate(402 168) rotate(118) scale(1.05)" filter="url(#soft)">
    <path d="M0-30 6-11 36 6v9L6 4 4 22l12 9v6L0 31l-16 6v-6l12-9 2-18-30 11V6L-6-11z"
          fill="#ffffff"/>
  </g>

  <!-- Titre -->
  <text x="256" y="74" text-anchor="middle"
        font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif"
        font-size="52" font-weight="bold" fill="#ffffff"
        letter-spacing="1" filter="url(#soft)">Chaîne Voyage</text>

  <text x="256" y="110" text-anchor="middle"
        font-family="Trebuchet MS, Segoe UI, Verdana, sans-serif"
        font-size="23" fill="#eaf8ff" letter-spacing="1.5"
        filter="url(#soft)">Comparateur de vols</text>
</svg>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callback — dashboard-perso</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1.5rem; line-height: 1.6; color: #1a1a1a; }
  h1 { color: #00a8e8; font-size: 1.4rem; }
  .row { margin: 1.5rem 0; }
  label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 0.25rem; }
  .value { font-family: ui-monospace, monospace; background: #f2f4f6; border: 1px solid #dde3e7; border-radius: 6px; padding: 0.6rem 0.8rem; word-break: break-all; }
  button { margin-top: 0.4rem; font-size: 0.8rem; padding: 0.3rem 0.7rem; border-radius: 6px; border: 1px solid #dde3e7; background: #fff; cursor: pointer; }
  button:hover { background: #eef2f4; }
  .empty { color: #999; font-style: italic; }
</style>
</head>
<body>
<h1>Connexion bancaire — retour</h1>
<p>Cette page ne fait qu'afficher ce que la banque/Enable Banking a renvoyé dans l'URL. Rien n'est envoyé ailleurs : tout se passe dans ton navigateur.</p>

<div class="row">
  <label>code (authorization_code)</label>
  <div class="value" id="code">—</div>
  <button onclick="copyField('code')">Copier</button>
</div>

<div class="row">
  <label>state</label>
  <div class="value" id="state">—</div>
  <button onclick="copyField('state')">Copier</button>
</div>

<div class="row">
  <label>error (si présent)</label>
  <div class="value" id="error">—</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const set = (id, key) => {
    const el = document.getElementById(id);
    const val = params.get(key);
    if (val) { el.textContent = val; }
    else { el.textContent = "(absent)"; el.classList.add("empty"); }
  };
  set("code", "code");
  set("state", "state");
  set("error", "error");

  function copyField(id) {
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text);
  }
</script>

<p><a href="/">← Retour au portfolio</a></p>
</body>
</html>
